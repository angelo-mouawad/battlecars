; One firmware for both cars. Pick the car when uploading:
;   pio run -e car1 -t upload
;   pio run -e car2 -t upload

[env]
platform = atmelavr
board = nanoatmega328new
framework = arduino
monitor_speed = 9600

lib_deps =
    symlink://../shared/BattleCarsProtocol
    sui77/rc-switch@^2.6.4
    greiman/SSD1306Ascii@^1.3.5
    arduino-libraries/Servo@^1.3.0

[env:car1]
build_flags = -D CAR_ID=1 -D HAS_HAMMER=1

[env:car2]
build_flags = -D CAR_ID=2 -D HAS_HAMMER=0
