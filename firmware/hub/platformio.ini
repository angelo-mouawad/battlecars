; Copy include/config.example.h to include/config.h and fill in your
; WiFi and backend details before building.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200

lib_deps =
    symlink://../shared/BattleCarsProtocol
    sui77/rc-switch@^2.6.4
    links2004/WebSockets@^2.7.3
    greiman/SSD1306Ascii@^1.3.5
    bblanchon/ArduinoJson@^7.4.3
