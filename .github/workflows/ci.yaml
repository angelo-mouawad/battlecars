name: Run tests

on:
  push:
    branches: ["main", "prod", "sec"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  # -------- Frontend --------
  test-frontend:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run frontend tests
        run: |
          cd frontend
          npm install
          npm run test --if-present -- --watchAll=false --passWithNoTests

  # -------- Backend --------
  test-backend:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Install Maven
        run: |
          curl -sL https://archive.apache.org/dist/maven/maven-3/3.9.6/binaries/apache-maven-3.9.6-bin.tar.gz | tar -xz -C /opt
          echo "/opt/apache-maven-3.9.6/bin" >> $GITHUB_PATH

      - name: Run backend unit tests
        env:
          DATASOURCE_ENV: dev
          CORS_ALLOWED_ORIGINS: http://localhost:3000
          GROQ_API_KEY: test-key-not-used
        run: cd backend && mvn test -Dtest="!MatchIntegrationTest,!PlayerControllerTest,!MatchHistoryControllerTest"

  # -------- SAST Security Scan --------
  sast-scan:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install Semgrep OSS
        run: pip install semgrep

      - name: Run Semgrep Scan
        run: semgrep scan --config="p/default" --config="p/java" --config="p/nextjs" --severity ERROR --error

  # -------- Container Security Scan --------
  container-scan:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Build Frontend Image
        run: docker build --no-cache --pull -t project-frontend:test ./frontend

      - name: Run Trivy Scan (Frontend)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "project-frontend:test"
          format: "table"
          exit-code: "1"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: false
          vuln-type: "os,library"
          scanners: "vuln,secret,misconfig"

      - name: Build Backend Image
        run: docker build --no-cache --pull -t project-backend:test ./backend

      - name: Run Trivy Scan (Backend)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "project-backend:test"
          format: "table"
          exit-code: "1"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: false
          vuln-type: "os,library"
          scanners: "vuln,misconfig"