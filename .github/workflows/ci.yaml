name: Run tests

on:
  push:
    branches: ["main", "prod"]

jobs:
  # -------- Frontend --------
  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Run frontend tests
        run: |
          cd frontend
          npm install
          npm run test --if-present -- --watchAll=false --passWithNoTests

  # -------- Backend --------
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Run backend tests
        run: cd backend && mvn test

  # -------- SAST Security Scan --------
  sast-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install Semgrep OSS
        run: pip install semgrep

      - name: Run Semgrep Scan
        run: semgrep scan --config="p/default" --config="p/java" --config="p/nextjs" --severity ERROR --error

# -------- Container Security Scan --------
  container-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Build Frontend Image
        run: docker build -t project-frontend:test ./frontend

      - name: Run Trivy Scan (Frontend)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'project-frontend:test'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: false
          vuln-type: 'os,library'
          scanners: 'vuln,secret,misconfig'

      - name: Build Backend Image
        run: docker build -t project-backend:test ./backend

      - name: Run Trivy Scan (Backend)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'project-backend:test'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: false
          vuln-type: 'os,library'
          scanners: 'vuln,secret,misconfig'