name: Run tests

on:
  push:
    branches: ["main", "prod", "sec"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  # -------- Frontend --------
  test-frontend:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Run frontend tests
        run: |
          cd frontend
          npm install
          npm run test --if-present -- --watchAll=false --passWithNoTests

  # -------- Backend --------
  test-backend:
    runs-on: self-hosted

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Run backend tests
        env:
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_NAME: db
          DATABASE_USER: testuser
          DATABASE_PASSWORD: testpassword
          DATASOURCE_ENV: dev
          CORS_ALLOWED_ORIGINS: http://localhost:3000
          GROQ_API_KEY: test-key-not-used
        run: cd backend && mvn test

  # -------- SAST Security Scan --------
  sast-scan:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install Semgrep OSS
        run: pip install semgrep

      - name: Run Semgrep Scan
        run: semgrep scan --config="p/default" --config="p/java" --config="p/nextjs" --severity ERROR --error

  # -------- Container Security Scan --------
  container-scan:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Build Frontend Image
        run: docker build --no-cache --pull -t project-frontend:test ./frontend

      - name: Run Trivy Scan (Frontend)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "project-frontend:test"
          format: "table"
          exit-code: "1"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: false
          vuln-type: "os,library"
          scanners: "vuln,secret,misconfig"

      - name: Build Backend Image
        run: docker build --no-cache --pull -t project-backend:test ./backend

      - name: Run Trivy Scan (Backend)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "project-backend:test"
          format: "table"
          exit-code: "1"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: false
          vuln-type: "os,library"
          scanners: "vuln,misconfig"