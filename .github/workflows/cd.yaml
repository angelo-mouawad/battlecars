name: Build and publish Docker images

on:
  workflow_run:
    workflows: ["Run tests"]
    types:
      - completed
    branches: ['main', 'prod']

env:
  REGISTRY: ghcr.io
  NEXT_PUBLIC_API_URL_PROD: "https://team-01-en-backend-itip-en-01.apps.okd.ucll.cloud"
  NEXT_PUBLIC_WS_URL_PROD: "wss://team-01-en-backend-itip-en-01.apps.okd.ucll.cloud/ws"
  NEXT_PUBLIC_API_URL_STAGING: "https://team-01-en-backend-itip-en-01-staging.apps.okd.ucll.cloud"
  NEXT_PUBLIC_WS_URL_STAGING: "wss://team-01-en-backend-itip-en-01-staging.apps.okd.ucll.cloud/ws"
  NEXT_PUBLIC_APP_PASSWORD: ${{ secrets.APP_PASSWORD }}

jobs:
  # -------- Frontend Staging (on main, after CI passes) --------
  build-frontend-staging:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Log in to registry
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta-frontend-staging
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-frontend
          tags: |
            type=raw,value=staging

      - name: Build and push frontend staging
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta-frontend-staging.outputs.tags }}
          labels: ${{ steps.meta-frontend-staging.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.NEXT_PUBLIC_API_URL_STAGING }}
            NEXT_PUBLIC_WS_URL=${{ env.NEXT_PUBLIC_WS_URL_STAGING }}
            NEXT_PUBLIC_APP_PASSWORD=${{ env.NEXT_PUBLIC_APP_PASSWORD }}


  # -------- Backend Staging (on main, after CI passes) --------
  build-backend-staging:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Log in to registry
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta-backend-staging
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-backend
          tags: |
            type=raw,value=staging

      - name: Build and push backend staging
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta-backend-staging.outputs.tags }}
          labels: ${{ steps.meta-backend-staging.outputs.labels }}

  # -------- Frontend Production (on prod, after CI passes) --------
  build-frontend-prod:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'prod'
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Log in to registry
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta-frontend-prod
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-frontend
          tags: |
            type=raw,value=prod

      - name: Build and push frontend prod
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta-frontend-prod.outputs.tags }}
          labels: ${{ steps.meta-frontend-prod.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.NEXT_PUBLIC_API_URL_PROD }}
            NEXT_PUBLIC_WS_URL=${{ env.NEXT_PUBLIC_WS_URL_PROD }}
            NEXT_PUBLIC_APP_PASSWORD=${{ env.NEXT_PUBLIC_APP_PASSWORD }}


  # -------- Backend Production (on prod, after CI passes) --------
  build-backend-prod:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'prod'
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Log in to registry
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta-backend-prod
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-backend
          tags: |
            type=raw,value=prod

      - name: Build and push backend prod
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta-backend-prod.outputs.tags }}
          labels: ${{ steps.meta-backend-prod.outputs.labels }}