spring.config.import=optional:application-local-test.properties

spring.datasource.url=jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME:db}
spring.datasource.username=${DATABASE_USER:testuser}
spring.datasource.password=${DATABASE_PASSWORD:testpassword}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
server.port=8080
spring.profiles.active=${DATASOURCE_ENV:dev}
groq.api.key=${GROQ_API_KEY:test-key-not-used}