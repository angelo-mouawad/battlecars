spring.application.name=battlecars-backend
spring.config.import=optional:application-local.properties

spring.datasource.url=jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME:battlecars}
spring.datasource.username=${DATABASE_USER:battlecars}
spring.datasource.password=${DATABASE_PASSWORD:battlecars}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

server.port=${SERVER_PORT:8080}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

management.endpoints.web.exposure.include=health

groq.api.key=${GROQ_API_KEY:}
elevenlabs.api.key=${ELEVENLABS_API_KEY:}
elevenlabs.voice.id=${ELEVENLABS_VOICE_ID:}
