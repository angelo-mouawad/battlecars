# Import local overrides (for development — file is gitignored)
spring.config.import=optional:application-local.properties

# Database — reads from environment variables (set by OKD secrets)
spring.datasource.url=${DATASOURCE_URL}/${DATASOURCE_DBNAME}
spring.datasource.username=${DATASOURCE_USERNAME}
spring.datasource.password=${DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# CORS — which frontend URLs are allowed to call this backend
# On OKD this gets overridden by the CORS_ALLOWED_ORIGINS env variable
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Server port
server.port=8080

# Active profile
spring.profiles.active=${DATASOURCE_ENV:dev}